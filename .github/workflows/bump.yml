# Checks upstream for a new stable release. If there is one, bumps pkgver,
# refreshes the checksums, test-builds, commits to main, then publishes.
name: bump

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:

concurrency: bump

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq pacman-contrib

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump if upstream has a newer stable release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: phantomptr/ps5upload
        run: |
          set -euo pipefail

          # /releases/latest skips drafts and pre-releases
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r .tag_name)
          latest=${tag#v}
          if [[ ! $latest =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected upstream tag '${tag}'"
            exit 1
          fi

          current=$(sed -n 's/^pkgver=//p' PKGBUILD)
          echo "current=${current} latest=${latest}"
          if (( $(vercmp "$latest" "$current") <= 0 )); then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^pkgver=.*/pkgver=${latest}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # makepkg and updpkgsums refuse to run as root
          useradd -m builder
          chown -R builder: .
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --nodeps --clean --cleanbuild --noconfirm

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          git commit -m "ps5upload-bin ${latest}"
          git push origin HEAD:main
          echo "bumped=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    uses: ./.github/workflows/aur.yml
    secrets: inherit
